name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト。
        uses: actions/checkout@v4

      - name: pnpm のセットアップ。
        uses: pnpm/action-setup@v4

      - name: Node.js のセットアップ。
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 依存関係のインストール。
        run: pnpm install --frozen-lockfile

      - name: API Worker のデプロイ。
        run: pnpm --filter @patto-md/api run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Web アプリのビルド。
        run: pnpm --filter @patto-md/web run build

      - name: Web Worker のデプロイ。
        run: pnpm --filter @patto-md/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
